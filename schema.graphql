input AddColumnInput {
  tableId: ID!
  kind: ColumnKind!
  name: String!
  grade: GradeScaleInput = null
}

input AddStudentInput {
  tableId: ID!
  matricola: String = null
  firstName: String! = ""
  lastName: String! = ""
}

type Cell {
  columnId: ID!
  display: String!
  flag: Boolean
  gradeBase: String
  gradeModifier: String!
  text: String
}

enum ColumnKind {
  MATRICOLA
  LAST_NAME
  FIRST_NAME
  EMAIL
  DSA
  DIS
  FLAG
  GRADE
  TEXT
}

type ColumnResult {
  column: TableColumn
  errors: [FieldError!]!
}

type Course {
  id: ID!
  name: String!
  academicYear: String!
  degreeProgram: String
}

type CourseResult {
  course: Course
  errors: [FieldError!]!
}

type CourseTable {
  id: ID!
  courseId: ID!
  name: String!
  date: Date
  location: String
}

input CreateCourseInput {
  name: String!
  academicYear: String!
  degreeProgram: String = null
}

input CreateTableInput {
  courseId: ID!
  name: String!
  date: Date = null
  location: String = null
}

type CsvImportResult {
  table: CourseTable
  importedCount: Int!
  errors: [CsvIssue!]!
  warnings: [CsvIssue!]!
}

type CsvIssue {
  row: Int
  field: String!
  message: String!
}

type CsvMapping {
  matricola: Int
  lastName: Int
  firstName: Int
  email: Int
  dsa: Int
  dis: Int
}

input CsvMappingInput {
  matricola: Int = null
  lastName: Int = null
  firstName: Int = null
  email: Int = null
  dsa: Int = null
  dis: Int = null
}

type CsvPreview {
  headers: [String!]!
  mapping: CsvMapping!
  totalRows: Int!
  rows: [CsvStudent!]!
  errors: [CsvIssue!]!
  warnings: [CsvIssue!]!
  delimiter: String!
  headerRow: Int!
}

type CsvStudent {
  rowNumber: Int!
  matricola: String
  lastName: String!
  firstName: String!
  email: String
  dsa: Boolean!
  dis: Boolean!
}

"""Date (isoformat)"""
scalar Date

type FieldError {
  field: String!
  code: String!
  message: String!
}

type GradeScale {
  maximum: String
  allowAboveMaximum: Boolean!
  allowNegative: Boolean!
  passThreshold: String
  modifiers: [String!]!
}

input GradeScaleInput {
  maximum: String = null
  allowAboveMaximum: Boolean! = false
  allowNegative: Boolean! = false
  passThreshold: String = null
  modifiers: [String!]! = []
}

input ImportCsvInput {
  table: CreateTableInput!
  file: PreviewCsvInput!
}

type Mutation {
  previewCsv(input: PreviewCsvInput!): CsvPreview!
  importCsvTable(input: ImportCsvInput!): CsvImportResult!
  createCourse(input: CreateCourseInput!): CourseResult!
  createTable(input: CreateTableInput!): TableResult!
  addStudent(input: AddStudentInput!): StudentResult!
  addColumn(input: AddColumnInput!): ColumnResult!
  updateColumn(input: UpdateColumnInput!): ColumnResult!
  deleteColumn(columnId: ID!): ColumnResult!

  """
  Imposta una cella a partire dal testo digitato; il testo vuoto svuota la cella.
  """
  setCell(input: SetCellInput!): StudentResult!
  saveTableView(input: SaveViewInput!): ViewResult!

  """Rende la vista quella in uso per la sua tabella."""
  selectTableView(viewId: ID!): ViewResult!
  deleteTableView(viewId: ID!): ViewsResult!
}

input PreviewCsvInput {
  contentBase64: String!
  mapping: CsvMappingInput = null
}

type Query {
  me: User!
  courses: [Course!]!
  courseTables(courseId: ID!): [CourseTable!]!
  studentRows(tableId: ID!): [StudentRow!]!
  tableColumns(tableId: ID!): [TableColumn!]!

  """
  Viste personali dell'utente: ordine e visibilità delle colonne, ordinamento delle righe.
  """
  tableViews(tableId: ID!): [TableView!]!
}

type RowSort {
  columnId: ID!
  descending: Boolean!
}

input RowSortInput {
  columnId: ID!
  descending: Boolean! = false
}

input SaveViewInput {
  tableId: ID!

  """Assente per creare una nuova vista."""
  viewId: ID = null
  name: String!
  columnOrder: [ID!]!
  hiddenColumns: [ID!]!
  rowSort: [RowSortInput!]!
}

input SetCellInput {
  rowId: ID!
  columnId: ID!
  value: String!
}

type StudentResult {
  row: StudentRow
  errors: [FieldError!]!
}

type StudentRow {
  id: ID!
  tableId: ID!
  matricola: String
  firstName: String!
  lastName: String!
  email: String
  dsa: Boolean!
  dis: Boolean!
  cells: [Cell!]!
}

type TableColumn {
  id: ID!
  tableId: ID!
  kind: ColumnKind!
  name: String!
  grade: GradeScale
}

type TableResult {
  table: CourseTable
  errors: [FieldError!]!
}

type TableView {
  """Assente per la vista predefinita non ancora salvata."""
  id: ID
  name: String!

  """Vista in uso: l'ultima usata."""
  active: Boolean!
  columnOrder: [ID!]!
  hiddenColumns: [ID!]!
  rowSort: [RowSort!]!
}

input UpdateColumnInput {
  columnId: ID!
  name: String = null
  grade: GradeScaleInput = null
}

type User {
  id: ID!
  name: String!
  email: String!
  provider: String!
}

type ViewResult {
  view: TableView
  errors: [FieldError!]!
}

type ViewsResult {
  views: [TableView!]
  errors: [FieldError!]!
}
