input AddStudentInput {
  tableId: ID!
  matricola: String = null
  firstName: String! = ""
  lastName: String! = ""
}

type Course {
  id: ID!
  name: String!
  academicYear: String!
  degreeProgram: String
}

type CourseResult {
  course: Course
  errors: [FieldError!]!
}

type CourseTable {
  id: ID!
  courseId: ID!
  name: String!
  date: Date
  location: String
}

input CreateCourseInput {
  name: String!
  academicYear: String!
  degreeProgram: String = null
}

input CreateTableInput {
  courseId: ID!
  name: String!
  date: Date = null
  location: String = null
}

type CsvImportResult {
  table: CourseTable
  importedCount: Int!
  errors: [CsvIssue!]!
  warnings: [CsvIssue!]!
}

type CsvIssue {
  row: Int
  field: String!
  message: String!
}

type CsvMapping {
  matricola: Int
  lastName: Int
  firstName: Int
  email: Int
  dsa: Int
  dis: Int
}

input CsvMappingInput {
  matricola: Int = null
  lastName: Int = null
  firstName: Int = null
  email: Int = null
  dsa: Int = null
  dis: Int = null
}

type CsvPreview {
  headers: [String!]!
  mapping: CsvMapping!
  totalRows: Int!
  rows: [CsvStudent!]!
  errors: [CsvIssue!]!
  warnings: [CsvIssue!]!
  delimiter: String!
  headerRow: Int!
}

type CsvStudent {
  rowNumber: Int!
  matricola: String
  lastName: String!
  firstName: String!
  email: String
  dsa: Boolean!
  dis: Boolean!
}

"""Date (isoformat)"""
scalar Date

type FieldError {
  field: String!
  code: String!
  message: String!
}

input ImportCsvInput {
  table: CreateTableInput!
  file: PreviewCsvInput!
}

type Mutation {
  previewCsv(input: PreviewCsvInput!): CsvPreview!
  importCsvTable(input: ImportCsvInput!): CsvImportResult!
  createCourse(input: CreateCourseInput!): CourseResult!
  createTable(input: CreateTableInput!): TableResult!
  addStudent(input: AddStudentInput!): StudentResult!
}

input PreviewCsvInput {
  contentBase64: String!
  mapping: CsvMappingInput = null
}

type Query {
  courses: [Course!]!
  courseTables(courseId: ID!): [CourseTable!]!
  studentRows(tableId: ID!): [StudentRow!]!
}

type StudentResult {
  row: StudentRow
  errors: [FieldError!]!
}

type StudentRow {
  id: ID!
  tableId: ID!
  matricola: String
  firstName: String!
  lastName: String!
  email: String
  dsa: Boolean!
  dis: Boolean!
}

type TableResult {
  table: CourseTable
  errors: [FieldError!]!
}
