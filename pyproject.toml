[project]
name = "gradient"
version = "0.1.0"
description = "Registro delle valutazioni universitarie"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncmy>=0.2.17",
    "cryptography>=50.0.2",
    "fastapi>=0.161.1",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "strawberry-graphql[fastapi]>=0.336.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["database: integrazione sulla MariaDB configurata, con dati temporanei dedicati"]
