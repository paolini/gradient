name: Pubblica immagine Docker

on:
  push:
    branches: [main]

permissions:
  contents: read

# Evita che due pubblicazioni aggiornino contemporaneamente il tag main.
concurrency:
  group: docker-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Scarica il codice
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Leggi la versione del codice
        id: version
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import tomllib

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version):
              raise SystemExit("project.version deve avere il formato X.Y.Z, per esempio 1.2.3")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"value={version}\n")
          PY

      - name: Prepara Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Accedi a Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Costruisci e pubblica
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            paolini/gradient:v${{ steps.version.outputs.value }}
            paolini/gradient:main
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
